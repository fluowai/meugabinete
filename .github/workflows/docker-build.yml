name: Build and Push Docker Images

on:
  push:
    branches: [main, master, codex/professional-ui]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/fluowai/meugabinete-frontend
  API_IMAGE: ghcr.io/fluowai/meugabinete-whatsapp-service
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUBLIC_VITE_SUPABASE_URL: https://cjirkvgalpignnaxixzr.supabase.co
  PUBLIC_VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqaXJrdmdhbHBpZ25uYXhpeHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjIzNzksImV4cCI6MjA5MzAzODM3OX0.MLVoApshNS_-0i56dnYXYEoP1_8WPEI5oknGbI6ijkg
  PUBLIC_VITE_WHATSAPP_SERVICE_URL: https://woogabinete.consultio.com.br

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Validate frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || env.PUBLIC_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || env.PUBLIC_VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_SERVICE_URL: ${{ secrets.VITE_WHATSAPP_SERVICE_URL || env.PUBLIC_VITE_WHATSAPP_SERVICE_URL }}
        run: |
          npm ci
          npm run build
          npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || env.PUBLIC_VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || env.PUBLIC_VITE_SUPABASE_ANON_KEY }}
            VITE_WHATSAPP_SERVICE_URL=${{ secrets.VITE_WHATSAPP_SERVICE_URL || env.PUBLIC_VITE_WHATSAPP_SERVICE_URL }}

  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-service/go.mod
          cache-dependency-path: whatsapp-service/go.sum

      - name: Validate whatsapp-service
        working-directory: whatsapp-service
        run: go test ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push whatsapp-service
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-service
          file: ./whatsapp-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.API_IMAGE }}:latest
