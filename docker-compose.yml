version: "3.8"

services:
  frontend:
    image: ghcr.io/fluowai/meugabinete-frontend:latest
    command:
      - /bin/sh
      - -c
      - >
        rm -f /etc/nginx/conf.d/*.conf
        && printf '%s\n'
        'server {'
        '  listen 80;'
        '  server_name _;'
        '  absolute_redirect off;'
        '  port_in_redirect off;'
        '  server_name_in_redirect off;'
        '  root /usr/share/nginx/html;'
        '  index index.html;'
        '  gzip on;'
        '  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;'
        '  gzip_min_length 1000;'
        '  location = / {'
        '    try_files /index.html =404;'
        '    add_header Cache-Control "public, max-age=3600";'
        '  }'
        '  location / {'
        '    try_files /index.html =404;'
        '    add_header Cache-Control "public, max-age=3600";'
        '  }'
        '  location /assets/ {'
        '    expires 1y;'
        '    add_header Cache-Control "public, immutable";'
        '  }'
        '}'
        > /etc/nginx/conf.d/default.conf
        && nginx -t
        && exec nginx -g 'daemon off;'
    environment:
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL}"
      VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY}"
      VITE_WHATSAPP_SERVICE_URL: "${VITE_WHATSAPP_SERVICE_URL}"
    networks:
      - consultio1
      - meugabinete_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=consultio1"
        - "traefik.http.routers.meugabinete_frontend.rule=Host(`woogabinete.consultio.com.br`)"
        - "traefik.http.routers.meugabinete_frontend.entrypoints=websecure"
        - "traefik.http.routers.meugabinete_frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.meugabinete_frontend.priority=1"
        - "traefik.http.routers.meugabinete_frontend.service=meugabinete_frontend"
        - "traefik.http.services.meugabinete_frontend.loadbalancer.server.port=80"

  whatsapp-service:
    image: ghcr.io/fluowai/meugabinete-whatsapp-service:latest
    environment:
      PORT: 3001
      ALLOWED_ORIGINS: "https://woogabinete.consultio.com.br"
      APP_URL: "${APP_URL:-https://woogabinete.consultio.com.br}"
      DATABASE_URL: "${DATABASE_URL:-file:/app/data/whatsapp_sessions.db?_pragma=foreign_keys(1)}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      SUPABASE_BUCKET: "${SUPABASE_BUCKET:-meugabinete}"
      JWT_SECRET: "${JWT_SECRET}"
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      CEP_FREE_PROVIDER: "${CEP_FREE_PROVIDER:-viacep}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID}"
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: "${WHATSAPP_WEBHOOK_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v22.0}"
    volumes:
      - whatsapp_data:/app/data
    networks:
      consultio1:
      meugabinete_internal:
        aliases:
          - api
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=consultio1"
        - "traefik.http.routers.meugabinete_api.rule=Host(`woogabinete.consultio.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.meugabinete_api.entrypoints=websecure"
        - "traefik.http.routers.meugabinete_api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.meugabinete_api.priority=10"
        - "traefik.http.routers.meugabinete_api.service=meugabinete_api"
        - "traefik.http.services.meugabinete_api.loadbalancer.server.port=3001"

volumes:
  whatsapp_data:
    driver: local

networks:
  consultio1:
    external: true
    name: consultio1
  meugabinete_internal:
    driver: overlay
    attachable: true
