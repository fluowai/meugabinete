version: "3.8"

services:
  frontend:
    image: ghcr.io/fluowai/meugabinete-frontend:latest
    command:
      - /bin/sh
      - -c
      - >
        printf '%s\n'
        'server {'
        '  listen 80;'
        '  server_name _;'
        '  root /usr/share/nginx/html;'
        '  index index.html;'
        '  gzip on;'
        '  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;'
        '  gzip_min_length 1000;'
        '  location / {'
        '    try_files $uri /index.html;'
        '  }'
        '  location /assets/ {'
        '    expires 1y;'
        '    add_header Cache-Control "public, immutable";'
        '  }'
        '}'
        > /etc/nginx/conf.d/default.conf
        && nginx -t
        && exec nginx -g 'daemon off;'
    environment:
      VITE_SUPABASE_URL: "https://cjirkvgalpignnaxixzr.supabase.co"
      VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqaXJrdmdhbHBpZ25uYXhpeHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjIzNzksImV4cCI6MjA5MzAzODM3OX0.MLVoApshNS_-0i56dnYXYEoP1_8WPEI5oknGbI6ijkg"
      VITE_WHATSAPP_SERVICE_URL: "https://woogabinete.consultio.com.br"
    networks:
      - consultio1
      - meugabinete_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=consultio1"
        - "traefik.http.routers.meugabinete_frontend.rule=Host(`woogabinete.consultio.com.br`)"
        - "traefik.http.routers.meugabinete_frontend.entrypoints=websecure"
        - "traefik.http.routers.meugabinete_frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.meugabinete_frontend.priority=1"
        - "traefik.http.routers.meugabinete_frontend.service=meugabinete_frontend"
        - "traefik.http.services.meugabinete_frontend.loadbalancer.server.port=80"

  whatsapp-service:
    image: ghcr.io/fluowai/meugabinete-whatsapp-service:latest
    environment:
      PORT: 3001
      ALLOWED_ORIGINS: "https://woogabinete.consultio.com.br"
      DATABASE_URL: "file:/app/data/whatsapp_sessions.db?_pragma=foreign_keys(1)"
      SUPABASE_URL: "https://cjirkvgalpignnaxixzr.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqaXJrdmdhbHBpZ25uYXhpeHpyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzQ2MjM3OSwiZXhwIjoyMDkzMDM4Mzc5fQ.RTXGhgTkp5UjSyiChm-4235N6avC8pN6Dv3ws6y2klM"
      SUPABASE_BUCKET: "meugabinete"
      JWT_SECRET: "b6TgqIi1txNJjVqwTrmuaVJHO6Y1hOFekJ2w/l7HihZ+uxtSJgVwd1ScRTX6IghWqJKpSrM0INZ59Q3gGo3Tnw=="
      AI_PROVIDER: "gemini"
      GEMINI_API_KEY: ""
      CEP_FREE_PROVIDER: "viacep"
    volumes:
      - whatsapp_data:/app/data
    networks:
      consultio1:
      meugabinete_internal:
        aliases:
          - api
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=consultio1"
        - "traefik.http.routers.meugabinete_api.rule=Host(`woogabinete.consultio.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.meugabinete_api.entrypoints=websecure"
        - "traefik.http.routers.meugabinete_api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.meugabinete_api.priority=10"
        - "traefik.http.routers.meugabinete_api.service=meugabinete_api"
        - "traefik.http.services.meugabinete_api.loadbalancer.server.port=3001"

volumes:
  whatsapp_data:
    driver: local

networks:
  consultio1:
    external: true
    name: consultio1
  meugabinete_internal:
    driver: overlay
    attachable: true
